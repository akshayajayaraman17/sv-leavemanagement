<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave Manager</title>
    <meta name="theme-color" content="#14406b" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Leave Mgr" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
    <script>
      // One-time cleanup for returning visitors: earlier builds registered a
      // service worker that cached a stale app shell and 404'd its hashed
      // chunks after every redeploy. This app no longer uses one. Unregister
      // anything still installed, drop its caches, and reload exactly once
      // (guarded) so this session runs on fresh network assets.
      (function () {
        if (!('serviceWorker' in navigator)) return
        navigator.serviceWorker.getRegistrations()
          .then(function (regs) {
            if (!regs || !regs.length) return
            return Promise.all(regs.map(function (r) { return r.unregister() })).then(function () {
              if (window.caches && caches.keys) {
                caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k) }) })
              }
              try {
                if (!sessionStorage.getItem('sw-cleaned')) {
                  sessionStorage.setItem('sw-cleaned', '1')
                  location.reload()
                }
              } catch (e) { /* private mode — skip the reload */ }
            })
          })
          .catch(function () { /* ignore */ })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
